<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>ماشین حساب ساده</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="calc-box">
    <h1>ماشین حساب ساده</h1>

    <input type="number" id="num1" placeholder="عدد اول">
    <input type="number" id="num2" placeholder="عدد دوم">

    <select id="operator">
      <option value="+">+</option>
      <option value="-">-</option>
      <option value="*">*</option>
      <option value="/">/</option>
    </select>

    <button id="calcBtn">حساب کن</button>

    <p id="result">نتیجه: -</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
